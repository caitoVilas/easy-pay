server:
  port: 30000
  servlet:
    context-path: /merchant-service/api
  tomcat:
    threads:
      max: 200
      min-spare: 20
spring:
  application:
    name: merchant-service
  datasource:
    url: jdbc:mysql://localhost:3306/merchant_db
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql:  true
  threads:
    virtual:
      enabled: true
eureka:
  client:
    service-url:
        defaultZone: http://localhost:8761/eureka/
        register-with-eureka: true
        fetch-registry: true
